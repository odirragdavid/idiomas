<style>
/* Layout: libro de frases de bolsillo. Barra fija arriba (idioma, categoría, búsqueda), lista de frases que se tocan para escuchar */
:root{

  --body:"Figtree","Segoe UI",system-ui,sans-serif;
}
:root[data-lang="fr"]{--accent:#2f5bd3;--accent-soft:#e3eafb}
:root[data-lang="es"]{--accent:#c2410c;--accent-soft:#fbe9df}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12151c; --surface:#1b2029; --ink:#eef1f7; --muted:#9aa3b5; --line:#2a313d; --chip:#252c38; --accent-soft:#1d3a30; color-scheme:dark}
  :root:not([data-theme="light"])[data-lang="it"]{--accent:#4cc394}
  :root:not([data-theme="light"])[data-lang="fr"]{--accent:#7d9cf5;--accent-soft:#1f2a4a}
  :root:not([data-theme="light"])[data-lang="es"]{--accent:#f08a54;--accent-soft:#3a2418}}
:root[data-theme="dark"]{--bg:#12151c; --surface:#1b2029; --ink:#eef1f7; --muted:#9aa3b5; --line:#2a313d; --chip:#252c38; --accent-soft:#1d3a30; color-scheme:dark}
:root[data-theme="dark"][data-lang="it"]{--accent:#4cc394}
:root[data-theme="dark"][data-lang="fr"]{--accent:#7d9cf5;--accent-soft:#1f2a4a}
:root[data-theme="dark"][data-lang="es"]{--accent:#f08a54;--accent-soft:#3a2418}
*,*::before,*::after{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px}
.wrap{max-width:680px;margin:0 auto;padding-inline:16px;padding-block:0 40px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:2;background:var(--bg);padding-block:14px 10px;display:flex;flex-direction:column;gap:10px;border-bottom:1px solid var(--line)}
.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-family:var(--display);font-weight:800;font-size:1.7rem;margin:0;letter-spacing:-.01em}
h1 span{color:var(--accent)}
.total{font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}
.langs{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--chip);padding:4px;border-radius:14px}
.lang{border:0;border-radius:10px;padding:9px 6px;background:transparent;color:var(--ink);font:700 .95rem var(--body);cursor:pointer}
.lang[aria-pressed="true"]{background:var(--surface);color:var(--accent);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.tools{display:flex;gap:8px}
.search{flex:1;min-width:0;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:10px 12px;font:500 1rem var(--body)}
.toggle{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:0 12px;font:700 .9rem var(--body);cursor:pointer;white-space:nowrap}
.toggle[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.cats{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.cats::-webkit-scrollbar{display:none}
.chip{flex:none;border:0;border-radius:999px;padding:7px 12px;background:var(--chip);color:var(--ink);font:600 .88rem var(--body);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--surface)}
.status{font-size:.85rem;color:var(--muted);min-height:1.2em;padding-top:10px}
h2{font-family:var(--display);font-weight:700;font-size:1.05rem;margin:22px 0 8px;color:var(--muted);letter-spacing:.02em}
.list{display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 10px 12px 14px;cursor:pointer;text-align:left;width:100%;color:var(--ink);font:inherit}
.row.playing{border-color:var(--accent);background:var(--accent-soft)}
.txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.tgt{font-family:var(--display);font-weight:700;font-size:1.18rem;line-height:1.25;transition:filter .2s}
.ph{font-size:.98rem;color:var(--accent);font-weight:600;letter-spacing:.01em}
.es{font-size:.92rem;color:var(--muted)}
.guide{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px 14px;margin-top:10px}
.guide summary{cursor:pointer;font-weight:700;padding:8px 0;color:var(--ink)}
.guide dl{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;margin:4px 0 12px;font-size:.92rem}
.guide dt{font-weight:700;color:var(--accent)}
.guide dd{margin:0;color:var(--muted)}
.guide p{font-size:.92rem;color:var(--muted);margin:4px 0 12px}
.note{font-size:.78rem;color:var(--muted);font-style:italic}
.practice .row:not(.shown) .ph,.practice .row:not(.shown) .tgt{filter:blur(7px);user-select:none}
.btns{display:flex;gap:6px;flex:none}
.ic{width:40px;height:40px;border-radius:50%;border:0;background:var(--chip);color:var(--ink);font-size:1.05rem;cursor:pointer;display:grid;place-items:center}
.ic.play{background:var(--accent);color:var(--surface)}
.row:focus-visible,.ic:focus-visible,.chip:focus-visible,.lang:focus-visible,.toggle:focus-visible,.search:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.empty{color:var(--muted);text-align:center;padding:30px 0}
@media (prefers-reduced-motion:reduce){.tgt{transition:none}}
</style>

</head>

 fr: '<p>En francés la fuerza va siempre en la última sílaba, así que no lleva acentos.</p><dl><dt>ã õ ẽ</dt><dd>vocal nasal: suena por la nariz y la «n» no se pronuncia. <i>bonjour</i> → bõzhur</dd><dt>ü</dt><dd>di «i» con los labios en «u»: <i>salut</i> → salü</dd><dt>ö</dt><dd>di «e» con los labios en «o»: <i>deux</i> → dö</dd><dt>ë</dt><dd>una «e» suave y corta: <i>je</i> → zhë</dd><dt>zh</dt><dd>como «sh» pero vibrando: <i>je</i> → zhë</dd><dt>z</dt><dd>«s» con zumbido de abeja: <i>maison</i> → mezõ</dd><dt>r</dt><dd>se hace en la garganta, como una «j» suave</dd></dl>'
};
const NAMES = {it:'en italiano', fr:'en francés', es:'en español'};
const COL = {es:0, it:1, fr:2};
const audioCache = {};
let lang = 'it', cat = 'todas', practice = false, current = null, playingRow = null;
try { const s = localStorage.getItem('frases-lang'); if (s && COL[s] !== undefined) lang = s; } catch (e) {}
const $ = id => document.getElementById(id);
let idx = 0; CATS.forEach(c => c.items.forEach(it => { it.i = idx++; }));
$('total').textContent = idx + ' frases';

const cats = $('cats');
[{c:'todas', l:'Todas'}, ...CATS].forEach(c => {
  const b = document.createElement('button');
  b.className = 'chip'; b.id = 'cat-' + c.c; b.textContent = c.l;
  b.onclick = () => { cat = c.c; render(); window.scrollTo({top:0}); };
  cats.appendChild(b);
});

function loadAudio(l) {
  if (audioCache[l]) return audioCache[l];
  $('status').textContent = 'Cargando voces…';
  audioCache[l] = fetch('audio-' + l + '.json').then(r => { if (!r.ok) throw 0; return r.json(); })
    .then(a => { if (l === lang) $('status').textContent = 'Toca una frase para escucharla. 🐢 = más lento.'; return a; })
    .catch(() => { delete audioCache[l]; $('status').textContent = 'No se pudieron cargar las voces. Revisa tu conexión y vuelve a elegir el idioma.'; return null; });
  return audioCache[l];
}

function play(it, row, slow) {
  if (practice) row.classList.add('shown');
  loadAudio(lang).then(a => {
    if (!a) return;
    try {
      if (current) current.pause();
      current = new Audio('data:audio/mpeg;base64,' + a[it.i]);
      current.playbackRate = slow ? 0.7 : 1;
      current.preservesPitch = true;
      if (playingRow) playingRow.classList.remove('playing');
      playingRow = row; row.classList.add('playing');
      current.onended = () => row.classList.remove('playing');
      current.play().catch(() => row.classList.remove('playing'));
    } catch (e) {}
  });
}

function clean(s) { return s.replace(/\s*\[.*?\]/, ''); }
function note(s) { const m = s.match(/\[(.*?)\]/); return m ? m[1] : ''; }
function norm(s) { return s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, ''); }

function render() {
  document.documentElement.dataset.lang = lang;
  $('langName').textContent = NAMES[lang];
  document.querySelectorAll('.lang').forEach(b => b.setAttribute('aria-pressed', b.dataset.l === lang));
  [...cats.children].forEach(b => b.setAttribute('aria-pressed', b.id === 'cat-' + cat));
  document.body.classList.toggle('practice', practice);
  $('guide').hidden = lang === 'es'; $('guideBody').innerHTML = GUIDE[lang] || '';
  const q = norm($('q').value.trim());
  const main = $('main'); main.textContent = '';
  let shown = 0;
  CATS.forEach(c => {
    if (cat !== 'todas' && c.c !== cat) return;
    const items = c.items.filter(it => !q || it.t.some(x => norm(x).includes(q)));
    if (!items.length) return;
    const h = document.createElement('h2'); h.textContent = c.l; main.appendChild(h);
    const list = document.createElement('div'); list.className = 'list';
    items.forEach(it => {
      shown++;
      const row = document.createElement('div'); row.className = 'row'; row.tabIndex = 0; row.setAttribute('role', 'button');
      const txt = document.createElement('div'); txt.className = 'txt';
      const tgt = document.createElement('span'); tgt.className = 'tgt'; tgt.textContent = clean(it.t[COL[lang]]);
      txt.appendChild(tgt);
      if (lang !== 'es') { const ph = document.createElement('span'); ph.className = 'ph'; ph.textContent = '[ ' + PH[lang][it.i] + ' ]'; txt.appendChild(ph); }
      const n = note(it.t[0]);
      if (lang !== 'es') { const es = document.createElement('span'); es.className = 'es'; es.textContent = clean(it.t[0]) + (n ? ' (' + n + ')' : ''); txt.appendChild(es); }
      else if (n) { const nn = document.createElement('span'); nn.className = 'note'; nn.textContent = n; txt.appendChild(nn); }
      const btns = document.createElement('div'); btns.className = 'btns';
      const slow = document.createElement('button'); slow.className = 'ic'; slow.textContent = '🐢'; slow.setAttribute('aria-label', 'Escuchar lento');
      const pl = document.createElement('button'); pl.className = 'ic play'; pl.textContent = '▶'; pl.setAttribute('aria-label', 'Escuchar');
      slow.onclick = e => { e.stopPropagation(); play(it, row, true); };
      pl.onclick = e => { e.stopPropagation(); play(it, row, false); };
      row.onclick = () => play(it, row, false);
      row.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); play(it, row, false); } };
      btns.append(slow, pl); row.append(txt, btns); list.appendChild(row);
    });
    main.appendChild(list);
  });
  if (!shown) { const p = document.createElement('p'); p.className = 'empty'; p.textContent = 'No hay frases con esa búsqueda.'; main.appendChild(p); }
}

document.querySelectorAll('.lang').forEach(b => b.onclick = () => {
  lang = b.dataset.l; try { localStorage.setItem('frases-lang', lang); } catch (e) {}
  if (current) current.pause(); render(); loadAudio(lang);
});
$('practice').onclick = () => { practice = !practice; $('practice').setAttribute('aria-pressed', practice); render(); };
$('q').addEventListener('input', render);
render(); loadAudio(lang);
</script>
